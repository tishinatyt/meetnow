<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>porooch</title>
    <script>
      // SPA redirect for GitHub Pages
      // Saves the full path/query/hash to sessionStorage, then redirects to root
      var l = window.location;
      sessionStorage.redirect = l.pathname.slice('/meetnow'.length) + l.search + l.hash;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/meetnow/');
    </script>
  </head>
  <body></body>
</html>
