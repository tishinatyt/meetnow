<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C4C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="porooch — ситуативні зустрічі поруч із тобою" />
    <title>porooch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Restore path after SPA redirect from 404.html.
      // Also strips the /meetnow base prefix on direct navigation so React Router
      // (no basename) can match routes — critical for OAuth callbacks (?code=...).
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        var l = window.location;
        var target;
        if (redirect && redirect !== '/') {
          // Came via 404.html redirect — use stored path (already has query+hash baked in)
          target = redirect;
        } else {
          // Direct navigation (including OAuth callback at /meetnow/?code=...)
          // Strip /meetnow base prefix, preserve query string and hash
          var stripped = l.pathname.replace(/^\/meetnow/, '') || '/';
          target = stripped + l.search + l.hash;
        }
        if (target !== l.pathname + l.search + l.hash) {
          window.history.replaceState(null, null, target);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
